<style id="habiba-site-polish">
/* ===== HABIBA v3 SITE POLISH — mobile-first hero, gold accents, touch targets ===== */
:root{
  --muted:#7d6363;
  --gold:#c9a227;
}

/* --- hero photo becomes a real <img> (sharp on retina, small payload on phones) --- */
.hero-slide .hero-img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:50% 50%;
  transform:scale(1.07);
  transition:transform 8s ease-out;
  will-change:transform;
}
.hero-slide.active .hero-img{ transform:scale(1); }
.hero-slide::before{ z-index:1; }
.hero-content{ z-index:2; }
.hero-arrow,.hero-dots{ z-index:4; }

/* --- gold hairline accents (kicker + section headings) --- */
.hero-kicker::after,
.eyebrow::after{
  content:""; display:block; width:34px; height:2px; margin-top:9px;
  background:linear-gradient(90deg,var(--gold),rgba(201,162,39,0));
  border-radius:2px;
}
.hero-copy .eyebrow::after{ margin:9px auto 0; }
.section-heading h2::after{
  content:""; display:block; width:44px; height:2px; margin:12px auto 0;
  background:linear-gradient(90deg,var(--gold),rgba(201,162,39,0));
  border-radius:2px;
}
.old-price{ color:#a9928f; }

/* --- category page hero: keep the photo readable on tall narrow screens --- */
.hero-photo{ will-change:transform; }

@media (max-width:650px){
  /* readable body copy in the hero */
  .hero-content p{ font-size:15px; line-height:1.75; max-width:34ch; }
  .hero-kicker{ font-size:11px; letter-spacing:2.4px; }
  .hero-slide .hero-img{ object-position:50% 24%; }

  /* comfortable tap targets (44px minimum) */
  .icon-btn{ min-width:44px; min-height:44px; }
  .add-cart{ min-width:44px; min-height:44px; }
  .primary-btn{ min-height:46px; }

  /* room for the sticky bar */
  body{ padding-bottom:76px; }
}

/* --- sticky mobile buy bar --- */
.mobile-buybar{ display:none; }
@media (max-width:650px){
  .mobile-buybar{
    position:fixed; left:0; right:0; bottom:0; z-index:480;
    display:flex; gap:8px;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    background:rgba(255,248,248,.97);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    box-shadow:0 -6px 20px rgba(143,77,80,.10);
  }
  .mbb-cart{
    position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px;
    min-width:66px; min-height:48px; background:#fff;
    border:1px solid var(--border); border-radius:14px;
    color:var(--rose-deep); font-size:10px; text-decoration:none;
  }
  .mbb-cart i{ font-size:17px; }
  .mbb-count{
    position:absolute; top:-7px; right:5px; min-width:18px; height:18px;
    border-radius:9px; background:var(--rose-dark); color:#fff;
    font-size:10px; line-height:18px; text-align:center; padding:0 4px;
  }
  .mbb-main{
    flex:1; display:flex; align-items:center; justify-content:center;
    min-height:48px; border-radius:14px; background:var(--rose-deep);
    color:#fff; text-decoration:none; font-size:13px; letter-spacing:.5px;
  }
  .mbb-main:active{ transform:scale(.99); }
  .whatsapp-float{ bottom:82px !important; }
}

@media (prefers-reduced-motion:reduce){
  .hero-slide .hero-img{ transition:none; transform:none; }
}

@media (max-width:650px){
  .hero-copy p{ font-size:13px !important; line-height:1.6; }
  .hero-copy .eyebrow{ font-size:9px !important; letter-spacing:1.6px; }
  .quick-cat{ font-size:10.5px !important; }
  .benefit p{ font-size:10px !important; }
  .benefit h4{ font-size:10.5px !important; }
  .product-toolbar p{ font-size:11px !important; }
  .results-head{ font-size:12px !important; }
}

/* ================= HABIBA v4 — iOS parity · type · spacing · strips ================= */

/* ---- 1. FONTS: Marcellus (elegant serif) + Jost (refined sans) + Tajawal for Arabic ---- */
:root{
  --serif:"Marcellus","Cormorant Garamond",Georgia,serif;
  --sans:"Jost","Poppins",Arial,sans-serif;
  --strip-a:#f7e2df;
  --strip-b:#f8ecdb;
  --strip-ink:#8f4d50;
}

html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{ font-family:var(--sans); -webkit-font-smoothing:antialiased; }

h1,h2,h3,.serif,.hero-content h1,.section-heading h2,.hero h1{
  font-family:var(--serif) !important;
  font-weight:400;
  letter-spacing:.4px;
}
.hero-content h1{ letter-spacing:.5px; }
.section-heading h2{ font-weight:400; }

/* ---- 2. iOS FIX: never leave the hero photo zoomed ---- */
.hero-slide .hero-img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:50% 50%;
  transform:none !important;           /* the old 1.07 start-scale is gone */
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  -webkit-transform:translateZ(0);
}
.hero-slide.active .hero-img{ transform:none !important; }
.hero{ -webkit-mask-image:-webkit-radial-gradient(white,black); }

/* ---- 3. iOS FIX: svh fallbacks (iOS < 15.4 dropped the whole declaration) ---- */
@media (max-width:650px){
  .hero{
    height:430px;                       /* fallback first, then the modern one */
    height:clamp(330px, 52svh, 430px);
    min-height:330px;
    max-height:430px;
    max-height:74svh;
    margin:0 8px;
  }
  .hero-slide{ background-position:50% 30% !important; }
  .hero-slide .hero-img{ object-position:50% 30% !important; }
}
@media (max-width:650px) and (max-height:700px){
  .hero{ height:330px; height:clamp(300px, 46svh, 360px); }
}
/* category pages: their hero rule also relied on svh */
@media (max-width:650px){
  .hero-photo{ object-position:50% 26% !important; }
}
@supports not (height: 100svh){
  @media (max-width:650px){
    .hero{ height:420px !important; max-height:420px !important; }
  }
}

/* ---- 4. ICONS: smaller glyphs, same comfortable tap targets ---- */
@media (max-width:650px){
  .icon-btn{ width:42px; height:42px; min-width:42px; min-height:42px; }
  .icon-btn i, .icon-btn .fa-solid{ font-size:15.5px !important; }
  .benefit > i{ font-size:15px !important; }
  .quick-icon{ width:38px; height:38px; font-size:15px !important; }
  .quick-icon i{ font-size:15px !important; }
  .add-cart i{ font-size:13px !important; }
  .whatsapp-float{ width:46px; height:46px; font-size:20px !important; }
  .hero-arrow i{ font-size:12px; }
}

/* ---- 5. PHONE LAYOUT: tighter, calmer vertical rhythm ---- */
@media (max-width:650px){
  .announcement{ font-size:9.5px; padding:7px 10px; letter-spacing:.8px; }
  .header{ height:70px; padding:6px 11px; }
  .brand img{ width:116px; height:52px; }
  .main-nav{ padding:0 11px 9px; }
  .main-nav a{ font-size:10.5px; letter-spacing:.3px; }

  .section{ padding:40px 13px 6px; }
  .section-heading{ margin-bottom:18px; }
  .section-heading h2{ font-size:clamp(26px, 7.4vw, 32px); }
  .section-heading p{ font-size:12px; }

  .benefits{ gap:14px 6px; padding:18px 11px; margin:14px 0 0; }
  .benefit{ gap:6px; }
  .benefit h4{ font-size:10px; letter-spacing:.4px; }
  .benefit p{ font-size:9.5px; line-height:1.5; }

  .product-grid{ gap:11px; }
  .product-image{ height:auto; aspect-ratio:1/1.16; }
  .product-card{ border-radius:14px; }
  .product-info{ padding:10px 10px 12px; }
  .product-info h3{ font-size:12px; line-height:1.45; }
  .price{ font-size:13px; }

  .category-card{ flex-basis:66%; }
  .category-image{ height:180px; }
  .category-info h3{ font-size:18px; }

  .footer-grid{ gap:22px; }
  .footer{ padding:34px 14px 18px; }
}

/* ---- 6. STRIPS ARE BACK — warm champagne, no more near-black ---- */
.bundles-ticker{
  background:linear-gradient(90deg,var(--strip-a) 0%,var(--strip-b) 34%,#f2d3ce 66%,var(--strip-a) 100%);
  color:var(--strip-ink) !important;
  border-top:1px solid rgba(201,162,39,.38);
  border-bottom:1px solid rgba(201,162,39,.38);
  padding:9px 0;
  margin:10px 0 14px;
  font-family:"Tajawal","Jost",sans-serif !important;
  font-size:11.5px;
  font-weight:500;
  letter-spacing:2.6px;
  overflow:hidden;
  visibility:visible;
}
.bundles-ticker span{
  display:inline-block; min-width:100%;
  animation-name:habibaTicker;
  animation-duration:var(--ticker-speed,18s);
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  will-change:transform;
}
/* every other dark strip on the site gets the same warm treatment */
#bundleTicker, #homeMiddleAnnouncement{
  background:linear-gradient(90deg,var(--strip-a),var(--strip-b),var(--strip-a)) !important;
  color:var(--strip-ink) !important;
  border-top:1px solid rgba(201,162,39,.38);
  border-bottom:1px solid rgba(201,162,39,.38);
}
.announcement{ background:linear-gradient(90deg,#e7bdbd,#d9a8a9) !important; color:#fff !important; }

/* ---- 7. sticky bar polish to match the new type ---- */
@media (max-width:650px){
  .mbb-main{ font-family:var(--sans); letter-spacing:1px; font-size:12.5px; }
  .mbb-cart span:not(.mbb-count){ font-size:9px; letter-spacing:.5px; }
}

@media (prefers-reduced-motion:reduce){
  .bundles-ticker span{ animation:none; }
}
</style>
